name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

concurrency:
  group: bww-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Server build and protocol integration tests
        run: |
          dotnet restore server --locked-mode
          dotnet build server -c Release --no-restore
          python3 tests/integration.py
          python3 tests/test_sd_copy.py
          python3 tests/test_release_downloads.py
      - name: Android build and lint
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
      - name: Package Windows server
        run: dotnet publish server -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:NuGetLockFilePath=obj/packages.publish.lock.json -o artifacts/windows-x64
      - name: Build and verify privately signed Android release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          BWW_ANDROID_KEYSTORE_BASE64: ${{ secrets.BWW_ANDROID_KEYSTORE_BASE64 }}
          BWW_ANDROID_STORE_PASSWORD: ${{ secrets.BWW_ANDROID_STORE_PASSWORD }}
          BWW_ANDROID_KEY_ALIAS: ${{ secrets.BWW_ANDROID_KEY_ALIAS }}
          BWW_ANDROID_KEY_PASSWORD: ${{ secrets.BWW_ANDROID_KEY_PASSWORD }}
        run: python3 scripts/build_signed_android.py
      - name: Package release downloads
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/package_downloads.py
      - uses: actions/upload-artifact@v4
        with:
          name: Bww-Windows-x64
          path: artifacts/windows-x64/Bww.Server.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Bww-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: downloads-build
          path: artifacts/downloads-build/
          if-no-files-found: error

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install firmware tools
        run: |
          python -m pip install platformio==6.1.18
          sudo apt-get update
          sudo apt-get install -y g++ libssl-dev libmbedtls-dev
      - name: Build ESP32 firmware
        run: pio run -d esp32
      - name: Test portable firmware core
        run: |
          dotnet restore server --locked-mode
          dotnet build server -c Release --no-restore
          python3 scripts/test_firmware.py
      - name: Package firmware downloads
        run: python3 scripts/package_firmware.py
      - uses: actions/upload-artifact@v4
        with:
          name: Bww-ESP32-binaries
          path: |
            esp32/.pio/build/esp32dev/firmware.bin
            esp32/.pio/build/esp32dev/bootloader.bin
            esp32/.pio/build/esp32dev/partitions.bin
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: downloads-firmware
          path: artifacts/downloads-firmware/
          if-no-files-found: error

  publish-downloads:
    needs: [build, firmware]
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: downloads-build
          path: artifacts/downloads-build
      - uses: actions/download-artifact@v4
        with:
          name: downloads-firmware
          path: artifacts/downloads-firmware
      - name: Publish verified downloads from the current main commit
        env:
          BUILD_REVISION: ${{ github.sha }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$BUILD_REVISION" ]; then
            echo "Main changed during this build; skipping outdated downloads."
            exit 0
          fi
          python3 scripts/publish_downloads.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/
          if ! git diff --staged --quiet; then
            git commit -m "Update release downloads in downloads/ [skip ci]"
            git push origin HEAD:main
          else
            echo "No downloads changes to commit."
          fi
