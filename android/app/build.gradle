plugins { id 'com.android.application' }
android {
    namespace 'dev.bww'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'dev.bww'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '0.6.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (System.getenv('BWW_ANDROID_KEYSTORE')) {
            release {
                storeFile file(System.getenv('BWW_ANDROID_KEYSTORE'))
                storePassword System.getenv('BWW_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('BWW_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('BWW_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.dev' }
        release {
            minifyEnabled false
            if (System.getenv('BWW_ANDROID_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
